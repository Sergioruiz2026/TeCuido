<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Ingresar - TeCuido</title>
  <script src="../config.js"></script><script src="../shared.js"></script>
  <style>
    :root{font:18px system-ui,sans-serif;color:#17233b;background:#f5f7fc}*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center}main{width:min(92vw,460px);padding:26px;background:#fff;border-radius:22px;box-shadow:0 8px 30px #131b2e18}h1{color:#003178;margin:0 0 8px}p{line-height:1.5;color:#4e5b70}label{display:block;margin:16px 0 6px;font-weight:700}input,button{box-sizing:border-box;width:100%;min-height:54px;border-radius:12px;padding:12px 14px;font:inherit}input{border:2px solid #dae2fd}button{border:0;margin-top:14px;background:#006d30;color:white;font-weight:700;cursor:pointer}.secondary{background:#e2e7ff;color:#003178}.password-field{display:flex;gap:8px}.password-field input{flex:1;min-width:0}.password-toggle{width:58px;background:#e2e7ff;color:#003178}#message{min-height:26px;margin-top:14px;color:#9e1710}a{color:#003178}
  </style>
</head>
<body>
  <main>
    <h1>TeCuido</h1>
    <p>Ingresa a tu cuenta para consultar y actualizar tus datos médicos.</p>
    <form id="login-form">
      <label for="email">Correo electrónico</label><input id="email" type="email" autocomplete="username" required>
      <label for="password">Contraseña</label>
      <div class="password-field"><input id="password" type="password" autocomplete="current-password" minlength="8" required><button class="password-toggle" id="toggle-password" type="button" aria-label="Mostrar contraseña" aria-pressed="false">Mostrar</button></div>
      <button id="submit" type="submit">Ingresar</button>
    </form>
    <button class="secondary" id="register" type="button">Crear mi cuenta</button>
    <div id="message" role="status" aria-live="polite"></div>
    <p>¿Necesitas ayuda médica urgente? Llama al número de emergencias de tu localidad.</p>
  </main>
  <script>
    const message=document.getElementById('message'),email=document.getElementById('email'),password=document.getElementById('password'),submit=document.getElementById('submit');
    document.getElementById('toggle-password').addEventListener('click',event=>{const button=event.currentTarget,visible=password.type==='text';password.type=visible?'password':'text';button.textContent=visible?'Mostrar':'Ocultar';button.setAttribute('aria-label',visible?'Mostrar contraseña':'Ocultar contraseña');button.setAttribute('aria-pressed',String(!visible));});
    document.getElementById('login-form').addEventListener('submit',async event=>{event.preventDefault();submit.disabled=true;message.textContent='Conectando…';try{await window.Tecuido.login(email.value.trim(),password.value);location.replace('../mi_d_a_resumen_diario_y_alarmas/code.html');}catch(error){message.textContent=error.message;submit.disabled=false;}});
    document.getElementById('register').addEventListener('click',()=>location.href='../registro/code.html');
  </script>
</body>
</html>
