<!doctype html>
<html lang="es">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Crear usuario - TeCuido</title>
<style>body{margin:0;min-height:100vh;display:grid;place-items:center;background:#faf8ff;color:#131b2e;font:18px Arial,sans-serif}main{width:min(92vw,460px);padding:28px;background:#fff;border-radius:24px;box-shadow:0 8px 30px #131b2e22}h1{color:#003178}label{display:block;margin:16px 0 6px;font-weight:700}.password-field{display:flex;align-items:center;border:2px solid #dae2fd;border-radius:14px;background:#fff}.password-field input{min-width:0;flex:1;border:0;outline:0}.password-field button{width:58px;min-width:58px;min-height:56px;margin:0;padding:8px;background:#e2e7ff;color:#003178;border:0;border-radius:0 12px 12px 0;font-size:26px;cursor:pointer}.password-field button:focus-visible{outline:3px solid #003178;outline-offset:2px}input,button{box-sizing:border-box;width:100%;min-height:56px;border-radius:14px;padding:12px 16px;font:inherit}input{border:2px solid #dae2fd}button{border:0;margin-top:16px;background:#006d30;color:#fff;font-weight:700}#message{min-height:28px;margin-top:16px;color:#ba1a1a}</style>
</head>
<body><main><h1>Crear usuario</h1><p>Usaremos tu correo y una clave para proteger tus datos.</p><form id="form"><label for="email">Correo electrónico</label><input id="email" type="email" required autocomplete="username" placeholder="Ejemplo: ana.perez@gmail.com"><small>Debe ser un correo real al que tengas acceso.</small><label for="password">Contraseña</label><div class="password-field"><input id="password" type="password" minlength="8" required autocomplete="new-password" placeholder="Ejemplo: TeCuido2026"><button aria-label="Mostrar contraseña" aria-pressed="false" class="toggle-password" data-target="password" type="button">◉</button></div><small>Usa mínimo 8 caracteres, una mayúscula, una minúscula y un número.</small><label for="repeat">Repetir contraseña</label><div class="password-field"><input id="repeat" type="password" minlength="8" required autocomplete="new-password" placeholder="Repite: TeCuido2026"><button aria-label="Mostrar repetición de contraseña" aria-pressed="false" class="toggle-password" data-target="repeat" type="button">◉</button></div><button>Crear usuario</button></form><div id="message" role="alert"></div><p><a href="../login/code.html">Ya tengo una cuenta: ingresar</a></p></main>
<script>
const API_URL=window.TECUIDO_API_URL||'http://localhost:3000'; const form=document.getElementById('form'); const message=document.getElementById('message');
document.querySelectorAll('.toggle-password').forEach(button=>button.addEventListener('click',()=>{const field=document.getElementById(button.dataset.target);const visible=field.type==='text';field.type=visible?'password':'text';button.textContent=visible?'◉':'◌';button.setAttribute('aria-label',visible?'Mostrar clave':'Ocultar clave');button.setAttribute('aria-pressed',String(!visible));}));
form.addEventListener('submit',async e=>{e.preventDefault(); if(!email.validity.valid){message.textContent='Ingresa un correo real, por ejemplo: ana.perez@gmail.com.';return;} if(!/^(?=.*[a-z])(?=.*[A-Z])(?=.*\d).{8,}$/.test(password.value)){message.textContent='La contraseña debe incluir 8 caracteres, mayúscula, minúscula y número.';return;} if(password.value!==repeat.value){message.textContent='Las contraseñas no coinciden.';return;} try{const r=await fetch(API_URL+'/api/auth/register',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({email:email.value.trim(),password:password.value})});const d=await r.json();if(!r.ok)throw Error(d.error);location.href='../login/code.html';}catch(err){message.textContent=err.message;}});
</script></body></html>
