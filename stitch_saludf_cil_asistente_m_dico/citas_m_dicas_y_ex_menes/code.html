<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Mis citas - TeCuido</title>
  <script src="../config.js"></script><script src="../shared.js"></script>
  <style>
    :root{font:16px system-ui,sans-serif;color:#17233b;background:#f5f7fc}*{box-sizing:border-box}body{margin:0;padding:0 0 86px}header{background:#fff;padding:16px max(20px,calc((100vw - 680px)/2));box-shadow:0 2px 12px #17233b12;position:sticky;top:0;z-index:1}header strong{font-size:21px;color:#003178}main{max-width:680px;margin:auto;padding:20px}.top{display:flex;align-items:center;justify-content:space-between;gap:12px}h1{font-size:27px;margin:14px 0 4px}h2{font-size:20px}button,a.button{border:0;border-radius:12px;background:#003178;color:white;padding:12px 16px;font:inherit;font-weight:700;text-decoration:none;cursor:pointer;min-height:46px}button.secondary,a.secondary{background:#e5ebf7;color:#17356a}button.danger{background:#ffe6e4;color:#9e1710}.muted{color:#5a6579}form,.card{background:#fff;border:1px solid #e2e7f1;border-radius:18px;padding:18px;margin:16px 0;box-shadow:0 4px 16px #17233b08}label{display:block;font-weight:650;margin:12px 0 6px}input,textarea,select{width:100%;min-height:46px;border:1px solid #b9c4d7;border-radius:10px;padding:10px;font:inherit;color:inherit}textarea{min-height:72px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}.status{min-height:24px;color:#9e1710}.status.ok{color:#006d30}.empty{text-align:center;padding:26px;color:#536078}.hidden{display:none!important}.tabs{display:flex;gap:8px;margin:18px 0}.tabs button{flex:1}.tabs button[aria-pressed=true]{background:#006d30}.card p{margin:7px 0;color:#46536b}nav{position:fixed;bottom:0;width:100%;display:flex;justify-content:center;gap:8px;background:#fff;padding:10px 10px calc(10px + env(safe-area-inset-bottom));box-shadow:0 -2px 12px #17233b12}nav a{flex:1;max-width:150px;text-align:center;text-decoration:none;color:#324667;padding:9px 4px;border-radius:10px}nav a[aria-current=page]{background:#e8eef9;color:#003178;font-weight:700}@media(max-width:460px){.grid{grid-template-columns:1fr}}
  </style>
</head>
<body>
  <header><div class="top"><strong>TeCuido</strong><a class="button secondary" href="../ficha_medica/code.html">Mi ficha</a></div></header>
  <main>
    <div class="top"><div><h1>Mis citas y exámenes</h1><div class="muted">Agrega y administra tus fechas médicas.</div></div><button id="new-appointment">Agregar</button></div>
    <p id="status" class="status" role="status" aria-live="polite"></p>
    <form id="appointment-form" class="hidden">
      <h2 id="form-title">Nueva cita</h2>
      <label for="title">Motivo o examen *</label><input id="title" maxlength="160" required>
      <div class="grid"><div><label for="provider">Profesional o centro</label><input id="provider" maxlength="160"></div><div><label for="phone">Teléfono</label><input id="phone" type="tel" maxlength="40"></div></div>
      <label for="starts-at">Fecha y hora *</label><input id="starts-at" type="datetime-local" required>
      <label for="location">Dirección</label><input id="location" maxlength="300" autocomplete="street-address">
      <label for="instructions">Indicaciones</label><textarea id="instructions" maxlength="1000" placeholder="Preparación u otra información entregada por el centro"></textarea>
      <label for="reminder">Antelación preferida (no genera una notificación)</label><select id="reminder"><option value="0">Sin aviso</option><option value="15">15 minutos antes</option><option value="60" selected>1 hora antes</option><option value="1440">1 día antes</option></select>
      <div class="actions"><button id="save-appointment" type="submit">Guardar cita</button><button class="secondary" id="cancel-edit" type="button">Cancelar</button></div>
    </form>
    <div class="tabs"><button id="upcoming-tab" aria-pressed="true">Próximas</button><button id="past-tab" class="secondary" aria-pressed="false">Pasadas</button></div>
    <section id="appointment-list" aria-live="polite"></section>
    <p class="muted">Las citas se sincronizan con tu cuenta. Los avisos automáticos del teléfono aún no están configurados.</p>
  </main>
  <nav aria-label="Navegación principal"><a href="../mi_d_a_resumen_diario_y_alarmas/code.html">Mi día</a><a href="../mis_remedios_y_alarmas/code.html">Remedios</a><a aria-current="page" href="./code.html">Citas</a><a href="../ficha_medica/code.html">Ficha</a></nav>
  <script>
    if (!window.Tecuido.hasSession()) location.replace('../login/code.html');
    const form=document.getElementById('appointment-form'),list=document.getElementById('appointment-list'),status=document.getElementById('status');
    let appointments=[],editingId=null,showPast=false;
    const fields={title:document.getElementById('title'),provider:document.getElementById('provider'),phone:document.getElementById('phone'),startsAt:document.getElementById('starts-at'),location:document.getElementById('location'),instructions:document.getElementById('instructions'),reminder:document.getElementById('reminder')};
    function showMessage(text,ok){status.textContent=text;status.classList.toggle('ok',Boolean(ok));}
    function addText(parent,tag,text,className){const element=document.createElement(tag);element.textContent=text;if(className)element.className=className;parent.appendChild(element);return element;}
    function localInputValue(iso){const date=new Date(iso);const local=new Date(date.getTime()-date.getTimezoneOffset()*60000);return local.toISOString().slice(0,16);}
    function resetForm(){form.reset();editingId=null;fields.reminder.value='60';form.classList.add('hidden');document.getElementById('form-title').textContent='Nueva cita';document.getElementById('save-appointment').textContent='Guardar cita';}
    async function load(){list.replaceChildren();addText(list,'p','Cargando citas…','empty');try{appointments=(await window.Tecuido.request('/api/appointments')).appointments||[];render();}catch(error){list.replaceChildren();addText(list,'p',error.message,'empty');}}
    function render(){list.replaceChildren();const now=Date.now();const visible=appointments.filter(a=>showPast?new Date(a.starts_at).getTime()<now||a.completed:new Date(a.starts_at).getTime()>=now&&!a.completed);if(!visible.length){addText(list,'p',showPast?'No tienes citas pasadas registradas.':'No tienes citas próximas. Usa “Agregar” para registrar una.','empty');return;}visible.forEach(item=>{const card=document.createElement('article');card.className='card';addText(card,'h2',item.title);addText(card,'p',new Date(item.starts_at).toLocaleString('es-CL',{dateStyle:'full',timeStyle:'short'}));if(item.provider)addText(card,'p','Profesional o centro: '+item.provider);if(item.location)addText(card,'p','Dirección: '+item.location);if(item.phone)addText(card,'p','Teléfono: '+item.phone);if(item.instructions)addText(card,'p','Indicaciones: '+item.instructions);if(item.completed)addText(card,'p','Marcada como realizada.','muted');const actions=document.createElement('div');actions.className='actions';if(!item.completed){const done=document.createElement('button');done.className='secondary';done.textContent='Marcar realizada';done.addEventListener('click',()=>patchAppointment(item,{completed:true}));actions.appendChild(done);}const edit=document.createElement('button');edit.className='secondary';edit.textContent='Editar';edit.addEventListener('click',()=>editAppointment(item));actions.appendChild(edit);const remove=document.createElement('button');remove.className='danger';remove.textContent='Eliminar';remove.addEventListener('click',()=>deleteAppointment(item));actions.appendChild(remove);card.appendChild(actions);list.appendChild(card);});}
    function editAppointment(item){editingId=item.id;fields.title.value=item.title;fields.provider.value=item.provider||'';fields.phone.value=item.phone||'';fields.startsAt.value=localInputValue(item.starts_at);fields.location.value=item.location||'';fields.instructions.value=item.instructions||'';fields.reminder.value=String(item.reminder_minutes??60);document.getElementById('form-title').textContent='Editar cita';document.getElementById('save-appointment').textContent='Guardar cambios';form.classList.remove('hidden');form.scrollIntoView({behavior:'smooth',block:'start'});}
    function payload(){return {title:fields.title.value.trim(),provider:fields.provider.value.trim(),phone:fields.phone.value.trim(),startsAt:new Date(fields.startsAt.value).toISOString(),location:fields.location.value.trim(),instructions:fields.instructions.value.trim(),reminderMinutes:Number(fields.reminder.value)};}
    async function patchAppointment(item,changes){try{await window.Tecuido.request('/api/appointments/'+encodeURIComponent(item.id),{method:'PATCH',body:changes});showMessage('Cita actualizada.',true);await load();}catch(error){showMessage(error.message);}}
    async function deleteAppointment(item){if(!confirm('¿Eliminar la cita “'+item.title+'”?'))return;try{await window.Tecuido.request('/api/appointments/'+encodeURIComponent(item.id),{method:'DELETE'});showMessage('Cita eliminada.',true);await load();}catch(error){showMessage(error.message);}}
    document.getElementById('new-appointment').addEventListener('click',()=>{resetForm();fields.startsAt.value=localInputValue(new Date().toISOString());form.classList.remove('hidden');fields.title.focus();});
    if(new URLSearchParams(location.search).get('new')==='1'){fields.startsAt.value=localInputValue(new Date().toISOString());form.classList.remove('hidden');}
    document.getElementById('cancel-edit').addEventListener('click',resetForm);
    document.getElementById('upcoming-tab').addEventListener('click',()=>{showPast=false;document.getElementById('upcoming-tab').setAttribute('aria-pressed','true');document.getElementById('upcoming-tab').classList.remove('secondary');document.getElementById('past-tab').setAttribute('aria-pressed','false');document.getElementById('past-tab').classList.add('secondary');render();});
    document.getElementById('past-tab').addEventListener('click',()=>{showPast=true;document.getElementById('past-tab').setAttribute('aria-pressed','true');document.getElementById('past-tab').classList.remove('secondary');document.getElementById('upcoming-tab').setAttribute('aria-pressed','false');document.getElementById('upcoming-tab').classList.add('secondary');render();});
    form.addEventListener('submit',async event=>{event.preventDefault();const button=document.getElementById('save-appointment');button.disabled=true;try{const data=payload();await window.Tecuido.request(editingId?'/api/appointments/'+encodeURIComponent(editingId):'/api/appointments',{method:editingId?'PATCH':'POST',body:data});showMessage(editingId?'Cambios guardados.':'Cita guardada.',true);resetForm();await load();}catch(error){showMessage(error.message);}finally{button.disabled=false;}});
    load();
  </script>
</body>
</html>
