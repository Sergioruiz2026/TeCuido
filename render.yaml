services:
  - type: web
    name: tecuido-api
    runtime: node
    plan: free
    rootDir: server
    buildCommand: npm ci --omit=dev
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: UBER_ACCESS_TOKEN
        sync: false
      - key: UBER_API_BASE_URL
        value: https://api.uber.com
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_ANON_KEY
        sync: false
