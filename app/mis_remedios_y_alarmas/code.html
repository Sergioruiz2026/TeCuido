<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Mis remedios - TeCuido</title>
  <script src="../config.js"></script><script src="../shared.js"></script>
  <style>
    :root{font:16px system-ui,sans-serif;color:#17233b;background:#f5f7fc}*{box-sizing:border-box}body{margin:0;padding:0 0 88px}header{background:#fff;padding:16px max(20px,calc((100vw - 680px)/2));box-shadow:0 2px 12px #17233b12;position:sticky;top:0;z-index:1}header strong{font-size:21px;color:#003178}main{max-width:680px;margin:auto;padding:20px}.top{display:flex;align-items:center;justify-content:space-between;gap:12px}h1{font-size:27px;margin:14px 0 4px}p{line-height:1.45}button,a.button{border:0;border-radius:12px;background:#003178;color:white;padding:12px 16px;font:inherit;font-weight:700;text-decoration:none;cursor:pointer;min-height:46px}button.secondary,a.secondary{background:#e5ebf7;color:#17356a}button.danger{background:#ffe6e4;color:#9e1710}button:disabled{opacity:.55}form,.card,.notice{background:#fff;border:1px solid #e2e7f1;border-radius:18px;padding:18px;margin:16px 0;box-shadow:0 4px 16px #17233b08}label{display:block;font-weight:650;margin:12px 0 6px}input,textarea{width:100%;min-height:46px;border:1px solid #b9c4d7;border-radius:10px;padding:10px;font:inherit;color:inherit}textarea{min-height:74px;resize:vertical}.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.times{display:flex;gap:6px;flex-wrap:wrap;margin:8px 0}.chip{border-radius:20px;background:#e7edfa;padding:6px 10px}.card h2{margin:0 0 6px;font-size:20px}.card p{margin:6px 0;color:#46536b}.muted{color:#5a6579}.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}.status{min-height:24px;color:#9e1710;margin:8px 0}.status.ok{color:#006d30}.empty{text-align:center;padding:28px 12px;color:#536078}.hidden{display:none!important}nav{position:fixed;bottom:0;width:100%;display:flex;justify-content:center;gap:8px;background:#fff;padding:10px env(safe-area-inset-right) calc(10px + env(safe-area-inset-bottom));box-shadow:0 -2px 12px #17233b12}nav a{flex:1;max-width:150px;text-align:center;text-decoration:none;color:#324667;padding:9px 4px;border-radius:10px}nav a[aria-current=page]{background:#e8eef9;color:#003178;font-weight:700}@media(max-width:460px){.grid{grid-template-columns:1fr}}
  </style>
</head>
<body>
  <header><div class="top"><strong>TeCuido</strong><a class="button secondary" href="../ficha_medica/code.html">Mi ficha</a></div></header>
  <main>
    <div class="top"><div><h1>Mis remedios</h1><div class="muted">Tu lista personal y el registro de tomas.</div></div><button id="new-med">Agregar</button></div>
    <p id="status" class="status" role="status" aria-live="polite"></p>
    <section id="alarm-notice" class="notice hidden" role="status" aria-live="polite"><p id="alarm-message"></p><button class="secondary" id="alarm-settings" type="button">Abrir ajustes de la aplicación</button></section>
    <form id="med-form" class="hidden">
      <h2 id="form-title">Agregar remedio</h2>
      <label for="name">Nombre del medicamento *</label><input id="name" required maxlength="120" autocomplete="off">
      <div class="grid"><div><label for="strength">Concentración</label><input id="strength" maxlength="80" placeholder="Ej.: 50 mg"></div><div><label for="dosage">Dosis indicada</label><input id="dosage" maxlength="120" placeholder="Ej.: 1 comprimido"></div></div>
      <label>Horarios de toma</label><div class="row"><input id="time-input" type="time" aria-label="Horario para agregar" style="max-width:170px"><button class="secondary" id="add-time" type="button">Añadir horario</button></div><div id="times" class="times"></div>
      <label for="instructions">Indicaciones</label><textarea id="instructions" maxlength="500" placeholder="Solo lo indicado por tu profesional de salud"></textarea>
      <label for="notes">Notas</label><textarea id="notes" maxlength="500"></textarea>
      <div class="actions"><button id="save-med" type="submit">Guardar</button><button class="secondary" id="cancel-edit" type="button">Cancelar</button></div>
    </form>
    <section id="med-list" aria-live="polite"></section>
  </main>
  <nav aria-label="Navegación principal"><a href="../mi_d_a_resumen_diario_y_alarmas/code.html">Mi día</a><a aria-current="page" href="./code.html">Remedios</a><a href="../citas_m_dicas_y_ex_menes/code.html">Citas</a><a href="../ficha_medica/code.html">Ficha</a></nav>
  <script>
    if (!window.Tecuido.hasSession()) location.replace('../login/code.html');
    const form=document.getElementById('med-form'),list=document.getElementById('med-list'),status=document.getElementById('status'),alarmNotice=document.getElementById('alarm-notice'),alarmMessage=document.getElementById('alarm-message'),alarmSettings=document.getElementById('alarm-settings');
    let medications=[], selectedTimes=[], editingId=null;
    const fields={name:document.getElementById('name'),strength:document.getElementById('strength'),dosage:document.getElementById('dosage'),instructions:document.getElementById('instructions'),notes:document.getElementById('notes')};
    function message(text,ok){status.textContent=text;status.classList.toggle('ok',Boolean(ok));}
    function appendText(parent,tag,text,className){const el=document.createElement(tag);el.textContent=text;if(className)el.className=className;parent.appendChild(el);return el;}
    function clearForm(){form.reset();selectedTimes=[];editingId=null;document.getElementById('form-title').textContent='Agregar remedio';document.getElementById('save-med').textContent='Guardar';renderTimes();form.classList.add('hidden');}
    function renderTimes(){const box=document.getElementById('times');box.replaceChildren();selectedTimes.forEach((time,index)=>{const chip=document.createElement('span');chip.className='chip';chip.textContent=time+' ';const remove=document.createElement('button');remove.type='button';remove.className='secondary';remove.textContent='×';remove.setAttribute('aria-label','Quitar horario '+time);remove.addEventListener('click',()=>{selectedTimes.splice(index,1);renderTimes();});chip.appendChild(remove);box.appendChild(chip);});}
    async function syncAlarms(){try{const result=await window.TecuidoAlarms.reprogramarTodo(medications);if(!result.available){alarmNotice.classList.add('hidden');return;}if(!result.granted){alarmMessage.textContent=result.notifications!=='granted'?'Permite las notificaciones de TeCuido para recibir avisos aunque la aplicación esté cerrada.':'Permite las alarmas exactas para que los avisos suenen a la hora indicada.';alarmNotice.classList.remove('hidden');return;}alarmNotice.classList.add('hidden');}catch(error){alarmMessage.textContent='No pudimos programar los recordatorios: '+error.message;alarmNotice.classList.remove('hidden');}}
    alarmSettings.addEventListener('click',async()=>{alarmSettings.disabled=true;try{await window.TecuidoAlarms.abrirAjustes();}catch(error){alarmMessage.textContent=error.message;}finally{alarmSettings.disabled=false;}});
    document.addEventListener('visibilitychange',()=>{if(!document.hidden)syncAlarms();});
    async function load(){list.replaceChildren();appendText(list,'p','Cargando remedios…','empty');try{const result=await window.Tecuido.request('/api/medications');medications=result.medications||[];render();await syncAlarms();}catch(error){list.replaceChildren();appendText(list,'p',error.message,'empty');}}
    function render(){list.replaceChildren();const active=medications.filter(m=>m.active),inactive=medications.filter(m=>!m.active);if(!medications.length){appendText(list,'p','Todavía no has agregado remedios. Usa “Agregar” para crear tu lista.','empty');return;}for(const [label,items] of [['Activos',active],['Pausados',inactive]]){if(!items.length)continue;appendText(list,'h2',label);for(const med of items){const card=document.createElement('article');card.className='card';appendText(card,'h2',med.name);appendText(card,'p',[med.strength,med.dosage].filter(Boolean).join(' · ')||'Sin concentración ni dosis especificadas','');if(med.times?.length){const chips=document.createElement('div');chips.className='times';med.times.forEach(t=>appendText(chips,'span',t,'chip'));card.appendChild(chips);}if(med.instructions)appendText(card,'p','Indicaciones: '+med.instructions);if(med.notes)appendText(card,'p','Nota: '+med.notes);const actions=document.createElement('div');actions.className='actions';const take=document.createElement('button');take.textContent='Registrar toma ahora';take.disabled=!med.active;take.addEventListener('click',()=>recordDose(med));actions.appendChild(take);const edit=document.createElement('button');edit.className='secondary';edit.textContent='Editar';edit.addEventListener('click',()=>editMedication(med));actions.appendChild(edit);const toggle=document.createElement('button');toggle.className='secondary';toggle.textContent=med.active?'Pausar':'Reanudar';toggle.addEventListener('click',()=>updateMedication(med,{active:!med.active}));actions.appendChild(toggle);const remove=document.createElement('button');remove.className='danger';remove.textContent='Eliminar';remove.addEventListener('click',()=>deleteMedication(med));actions.appendChild(remove);card.appendChild(actions);list.appendChild(card);}}}
    function editMedication(med){editingId=med.id;fields.name.value=med.name;fields.strength.value=med.strength||'';fields.dosage.value=med.dosage||'';fields.instructions.value=med.instructions||'';fields.notes.value=med.notes||'';selectedTimes=[...(med.times||[])];renderTimes();document.getElementById('form-title').textContent='Editar remedio';document.getElementById('save-med').textContent='Guardar cambios';form.classList.remove('hidden');form.scrollIntoView({behavior:'smooth',block:'start'});}
    function formData(){return {name:fields.name.value.trim(),strength:fields.strength.value.trim(),dosage:fields.dosage.value.trim(),instructions:fields.instructions.value.trim(),notes:fields.notes.value.trim(),times:selectedTimes,active:true};}
    async function updateMedication(med,changes){try{await window.Tecuido.request('/api/medications/'+encodeURIComponent(med.id),{method:'PATCH',body:changes});message('Cambios guardados.',true);await load();}catch(error){message(error.message);}}
    async function deleteMedication(med){if(!confirm('¿Eliminar '+med.name+' y su historial de tomas?'))return;try{await window.Tecuido.request('/api/medications/'+encodeURIComponent(med.id),{method:'DELETE'});message('Remedio eliminado.',true);await load();}catch(error){message(error.message);}}
    async function recordDose(med){const now=new Date();const nearest=(med.times||[]).map(time=>{const [h,m]=time.split(':').map(Number);const scheduled=new Date();scheduled.setHours(h,m,0,0);return scheduled;}).filter(time=>Math.abs(time-now)<90*60*1000).sort((a,b)=>Math.abs(a-now)-Math.abs(b-now))[0];if(!confirm('¿Registrar que tomaste '+med.name+' ahora?'))return;try{await window.Tecuido.request('/api/medications/'+encodeURIComponent(med.id)+'/doses',{method:'POST',body:{status:'taken',scheduledFor:(nearest||now).toISOString()}});message('Toma registrada.',true);}catch(error){message(error.message);}}
    document.getElementById('new-med').addEventListener('click',()=>{clearForm();form.classList.remove('hidden');fields.name.focus();});
    if(new URLSearchParams(location.search).get('new')==='1'){form.classList.remove('hidden');}
    document.getElementById('cancel-edit').addEventListener('click',clearForm);
    document.getElementById('add-time').addEventListener('click',()=>{const input=document.getElementById('time-input');if(!input.value)return message('Elige primero un horario.');if(selectedTimes.length>=8)return message('Puedes guardar hasta 8 horarios.');if(!selectedTimes.includes(input.value)){selectedTimes.push(input.value);selectedTimes.sort();renderTimes();}input.value='';});
    form.addEventListener('submit',async event=>{event.preventDefault();const button=document.getElementById('save-med');button.disabled=true;try{const data=formData();if(editingId)await window.Tecuido.request('/api/medications/'+encodeURIComponent(editingId),{method:'PATCH',body:data});else await window.Tecuido.request('/api/medications',{method:'POST',body:data});message(editingId?'Cambios guardados.':'Remedio agregado.',true);clearForm();await load();}catch(error){message(error.message);}finally{button.disabled=false;}});
    load();
  </script>
</body>
</html>
