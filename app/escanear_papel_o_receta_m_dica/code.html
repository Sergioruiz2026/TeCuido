<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Fotografiar receta - TeCuido</title>
  <script src="../config.js"></script><script src="../shared.js"></script>
  <style>
    :root{font:17px system-ui,sans-serif;color:#17233b;background:#f5f7fc}*{box-sizing:border-box}body{margin:0}main{max-width:640px;margin:30px auto;padding:20px}.panel{background:#fff;border-radius:18px;padding:22px;margin:16px 0;box-shadow:0 4px 16px #17233b0a}h1{font-size:27px;color:#003178}p{line-height:1.5}.notice{padding:14px;border-radius:12px;background:#fff4d2;color:#624b0c}.button{display:flex;align-items:center;justify-content:center;min-height:54px;width:100%;padding:12px 16px;margin:12px 0;border-radius:12px;background:#003178;color:#fff;font:inherit;font-weight:700;text-decoration:none;border:0}.button.secondary{background:#e5ebf7;color:#17356a}input{width:100%;padding:12px;font:inherit}img{max-width:100%;max-height:55vh;object-fit:contain;border-radius:12px}.hidden{display:none}.caption{color:#59667c;font-size:15px}
  </style>
</head>
<body>
  <main>
    <a href="../mis_remedios_y_alarmas/code.html">← Remedios</a>
    <section class="panel">
      <h1>Fotografiar una receta</h1>
      <p class="notice">La app puede abrir la cámara o galería para que revises la imagen en tu dispositivo, pero todavía no tiene OCR. No leerá la receta ni creará medicamentos automáticamente.</p>
      <label class="button" for="photo">Tomar o elegir una foto</label>
      <input id="photo" type="file" accept="image/*" capture="environment">
      <img id="preview" class="hidden" alt="Vista previa local de la imagen seleccionada">
      <p id="file-name" class="caption" aria-live="polite"></p>
      <a class="button secondary" href="../mis_remedios_y_alarmas/code.html?new=1">Ingresar el medicamento manualmente</a>
    </section>
  </main>
  <script>
    if (!window.Tecuido.hasSession()) location.replace('../login/code.html');
    const input=document.getElementById('photo'),preview=document.getElementById('preview'),fileName=document.getElementById('file-name');
    let previewUrl=null;
    input.addEventListener('change',()=>{if(previewUrl)URL.revokeObjectURL(previewUrl);const file=input.files&&input.files[0];if(!file){preview.classList.add('hidden');fileName.textContent='';return;}previewUrl=URL.createObjectURL(file);preview.src=previewUrl;preview.classList.remove('hidden');fileName.textContent=file.name+' · La imagen permanece en esta vista y no se sube ni se guarda.';});
    window.addEventListener('pagehide',()=>{if(previewUrl)URL.revokeObjectURL(previewUrl);});
  </script>
</body>
</html>
