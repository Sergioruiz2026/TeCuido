name: Build APK

on:
  push:
    tags: ['v*']          # al crear un tag como v1.0.1 se compila y publica
  workflow_dispatch:      # o manualmente desde la pestaña Actions

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - run: npm ci

      # OJO: NO se ejecuta "web:sync" (la carpeta fuente original ya no existe y pisaría app/)
      - name: Configurar URL de la API (HTTPS)
        run: node scripts/configure-api.js --release
        env:
          TECUIDO_API_URL: ${{ secrets.TECUIDO_API_URL }}

      - run: npx cap sync android

      - name: Restaurar keystore
        run: echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > "$RUNNER_TEMP/tecuido.jks"

      - name: Compilar APK release firmado
        working-directory: android
        run: ./gradlew assembleRelease
        env:
          TECUIDO_KEYSTORE_FILE: ${{ runner.temp }}/tecuido.jks
          TECUIDO_KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          TECUIDO_KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          TECUIDO_KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}

      - name: Renombrar
        run: cp android/app/build/outputs/apk/release/app-release.apk TeCuido.apk

      - uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: TeCuido.apk

      - uses: actions/upload-artifact@v4
        with:
          name: TeCuido-apk
          path: TeCuido.apk
